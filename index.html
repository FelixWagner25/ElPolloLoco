<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="./img/favicon.png" />

    <script src="./js/parameters.js" defer></script>
    <script src="./js/classes/drawable-object.class.js" defer></script>
    <script src="./js/classes/movable-object.class.js" defer></script>
    <script src="./js/classes/collectable-object.class.js" defer></script>
    <script src="./js/classes/bottle.class.js" defer></script>

    <script src="./js/classes/character.class.js" defer></script>
    <script src="./js/classes/chicken.class.js" defer></script>
    <script src="./js/classes/small-chicken.class.js" defer></script>
    <script src="./js/classes/cloud.class.js" defer></script>
    <script src="./js/classes/background-layer.class.js" defer></script>
    <script src="./js/classes/keyboard.class.js" defer></script>
    <script src="./js/classes/level.class.js" defer></script>
    <script src="./js/classes/endboss.class.js" defer></script>

    <script src="./js/classes/statusbar.class.js" defer></script>
    <script src="./js/classes/coin.class.js" defer></script>
    <script src="./js/levels/level1.js" defer></script>
    <script src="./js/classes/world.class.js" defer></script>
    <script src="./js/game.js" defer></script>

    <title>El Pollo Loco</title>
  </head>
  <body>
    <h1>El Pollo Loco</h1>

    <canvas id="canvas" width="720px" height="480px" onclick="init()"> </canvas>
    <section class="instruction-wrap">
      <div class="instruction-item">
        <img
          class="instruction-img"
          src="./icons/arrow_left.svg"
          alt="Keyboar arrow left"
        />
        <span>Back</span>
      </div>
      <div class="instruction-item">
        <img
          class="instruction-img"
          src="./icons/arrow_right.svg"
          alt="Keyboar arrow left"
        />
        <span>Forward</span>
      </div>
      <div class="instruction-item">
        <img
          class="instruction-img"
          src="./icons/arrow_up.svg"
          alt="Keyboar arrow left"
        />
        <span>Jump</span>
      </div>
      <div class="d-key-instruction-wrap">
        <span class="d-key">D</span>
        <span>Throw Bottle</span>
      </div>
    </section>
    <section class="mobile-steering">
      <div class="mobile-btn-wrap">
        <button class="mobile-btn mobile-btn-left" id="btn-left"></button>
        <button class="mobile-btn mobile-btn-right" id="btn-right"></button>
      </div>
      <div class="mobile-btn-wrap">
        <button class="mobile-btn mobile-btn-up" id="btn-up"></button>
        <button class="mobile-btn mobile-btn-throw" id="btn-throw"></button>
      </div>
    </section>
    <footer>
      <a
        class="lnk"
        href="./html/impressum.html"
        rel="noopener noreferrer"
        target="_blank"
        >Impressum</a
      >
    </footer>
    <div class="turn-device">
      <span class="turn-device-text">Please turn your device to play</span>
    </div>
  </body>
</html>
