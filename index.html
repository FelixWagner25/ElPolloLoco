<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="./img/favicon.png" />

    <script src="./js/parameters.js" defer></script>
    <script src="./js/audio.js" defer></script>
    <script src="./js/classes/drawable-object.class.js" defer></script>
    <script src="./js/classes/movable-object.class.js" defer></script>
    <script src="./js/classes/collectable-object.class.js" defer></script>
    <script src="./js/classes/bottle.class.js" defer></script>

    <script src="./js/classes/character.class.js" defer></script>
    <script src="./js/classes/chicken.class.js" defer></script>
    <script src="./js/classes/small-chicken.class.js" defer></script>
    <script src="./js/classes/cloud.class.js" defer></script>
    <script src="./js/classes/background-layer.class.js" defer></script>
    <script src="./js/classes/keyboard.class.js" defer></script>
    <script src="./js/classes/level.class.js" defer></script>
    <script src="./js/classes/endboss.class.js" defer></script>

    <script src="./js/classes/statusbar.class.js" defer></script>
    <script src="./js/classes/coin.class.js" defer></script>
    <script src="./js/levels/level1.js" defer></script>
    <script src="./js/classes/world.class.js" defer></script>
    <script src="./js/game.js" defer></script>

    <title>El Pollo Loco</title>
  </head>
  <body onload="processMuteSetting()">
    <h1>El Pollo Loco</h1>

    <section class="bg-dimmed" id="bg-dimmed">
      <div class="allow-sounds-wrap">
        Please allow automatic sounds to contine ...
        <button
          class="allow-sounds-btn"
          id="allow-sounds-btn"
          onclick="allowSounds()"
        >
          Allow Sounds
        </button>
      </div>
    </section>

    <section class="canvas-btn-wrap" width="720px" height="480px">
      <canvas id="canvas" width="720px" height="480px"> </canvas>
      <button class="btn-mute" id="btn-mute"></button>
      <div class="game-screen start-screen" id="start-screen">
        <button class="screen-btn start-btn" onclick="init()">
          Start Game
        </button>
      </div>
      <div class="game-screen end-screen-won" id="end-screen-won">
        <button class="screen-btn restart-btn" onclick="restartGame()">
          Restart Game
        </button>
        <button class="screen-btn home-btn" onclick="returnToHome()">
          Back to Home
        </button>
        <img
          src="img/img_pollo_locco/You won, you lost/You won A.png"
          alt="You Won!"
          class="end-screen-img"
        />
      </div>
      <div class="game-screen end-screen-lost" id="end-screen-lost">
        <button class="screen-btn restart-btn" onclick="restartGame()">
          Restart Game
        </button>
        <button class="screen-btn home-btn" onclick="returnToHome()">
          Back to Home
        </button>
        <img
          src="img/img_pollo_locco/You won, you lost/Game over A.png"
          alt="You lost ..."
          class="end-screen-img"
        />
      </div>
    </section>

    <section class="canvas-subline">
      <section class="instruction-wrap">
        <div class="instruction-item">
          <img
            class="instruction-img"
            src="./icons/arrow_left.svg"
            alt="Keyboar arrow left"
          />
          <span>Back</span>
        </div>
        <div class="instruction-item">
          <img
            class="instruction-img"
            src="./icons/arrow_right.svg"
            alt="Keyboar arrow left"
          />
          <span>Forward</span>
        </div>
        <div class="instruction-item">
          <img
            class="instruction-img"
            src="./icons/arrow_up.svg"
            alt="Keyboar arrow left"
          />
          <span>Jump</span>
        </div>
        <div class="d-key-instruction-wrap">
          <span class="d-key">D</span>
          <span>Throw Bottle</span>
        </div>
      </section>
    </section>

    <section class="mobile-btn-wrap">
      <button class="mobile-btn mobile-btn-left" id="btn-left"></button>
      <button class="mobile-btn mobile-btn-right" id="btn-right"></button>
      <button class="mobile-btn mobile-btn-up" id="btn-up"></button>
      <button class="mobile-btn mobile-btn-throw" id="btn-throw"></button>
    </section>

    <footer>
      <a
        class="lnk"
        href="./impressum.html"
        rel="noopener noreferrer"
        target="_blank"
        >Impressum</a
      >
    </footer>
    <div class="turn-device">
      <span class="turn-device-text">Please turn your device to play</span>
    </div>
  </body>
</html>
